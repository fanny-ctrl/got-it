<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}Got-it{% endblock %}</title>
  <link rel="icon" href="/static/icone.ico">
  <link rel="stylesheet" href="/static/style.css?v={{ version }}">
</head>
<body>
  <header class="bandeau">
    <a class="marque" href="/">Got-it</a>
    <nav>
      <a href="/">Transcriptions</a>
      <a href="/nouvelle">Nouvel enregistrement</a>
      <a href="/reglages">Réglages</a>
    </nav>
    <span class="local" title="Aucune donnée ne quitte cet ordinateur">● Tout reste sur ce PC</span>
  </header>
  <main>
    {% block contenu %}{% endblock %}
  </main>
  <script>
    // Signe de présence : tant qu'une page est ouverte, Got-it reste en marche (voir lancer.py).
    setInterval(function () { fetch("/api/presence", { cache: "no-store" }).catch(function () {}); }, 5000);
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
